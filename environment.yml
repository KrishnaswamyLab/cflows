name: cflows
channels:
  - pytorch
  - conda-forge
dependencies:
  - python=3.10
  - numpy=1.26.4
  - pandas=1.5.3
  - scipy=1.14.1
  - scikit-learn=1.3.2
  - statsmodels=0.14.0
  - joblib=1.3.2
  - tqdm
  - ipykernel=6.29.5
  - notebook=7.2.2
  - matplotlib=3.8.2
  - seaborn=0.13.2
  - scanpy=1.10.2
  - anndata=0.10.8
  - omegaconf=2.3.0   # required to deserialize the fitted decoder checkpoint
  - pytorch=2.1.1
  - cpuonly
  - pip
  - pip:
      - torchdiffeq==0.2.3
